services:
  api:
    build: .
    ports:
      - "10000:10000"
    env_file:
      - ../.env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - TOKEN_EXPIRY_HOURS=${TOKEN_EXPIRY_HOURS:-8}
      - OPENROUTER_STUDENT_KEY=${OPENROUTER_STUDENT_KEY}
      - OPENROUTER_TEACHER_KEY=${OPENROUTER_TEACHER_KEY}
      - OPENROUTER_ADMIN_KEY=${OPENROUTER_ADMIN_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - ENV=production
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:10000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
